name: CI

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: read

jobs:
    ci:
        name: CI
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: codebase/rdicidr-0.1.0

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 15
                cache: npm
                cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json

            - name: Install dependencies
              run: npm install

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm run test
              env:
                CI: true

            - name: Build
              run: npm run build