name: CI and CD

on:
    push:
        branches:
            - main
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: read

env:
    ACR_NAME: fsldevopschallengeacr
    ACR_LOGIN_SERVER: fsldevopschallengeacr.azurecr.io
    IMAGE_NAME: rdicidr
    RESOURCE_GROUP: fsl-devops-challenge-rg
    CONTAINER_APP: fsl-challenge

jobs:
    ci:
        name: CI
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: codebase/rdicidr-0.1.0

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 15
                cache: npm
                cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json

            - name: Install dependencies
              run: npm install

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm run test
              env:
                CI: true

            - name: Build
              run: npm run build

    deploy:
        name: Build, publish, and deploy
        needs: ci
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: production
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Sign in to Azure with OpenID Connect
              uses: azure/login@v2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Sign in to Azure Container Registry
              run: az acr login --name "$ACR_NAME"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: codebase/rdicidr-0.1.0
                  file: codebase/rdicidr-0.1.0/Dockerfile
                  push: true
                  tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            - name: Deploy image to Azure Container Apps
              run: >-
                  az containerapp update
                  --name "$CONTAINER_APP"
                  --resource-group "$RESOURCE_GROUP"
                  --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
